[package]
name = "kazi"
version = "0.26.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "A tiny, from-scratch AI agent CLI and library for OpenAI-compatible APIs, Claude, and Ollama"
repository = "https://github.com/klaxonz/kazi"
keywords = ["ai", "agent", "llm", "cli", "tools"]
categories = ["command-line-utilities"]
readme = "README.md"
# crates.io upload whitelist (include_str! reads config.example.toml at build)
include = [
    # Anchored with a leading "/": these are gitignore-style patterns, so a
    # bare "README.md" would also match docs/tui/README.md.
    "/src/**/*",
    "/Cargo.toml",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
    "/README.md",
    "/CHANGELOG.md",
    # prose docs ship; the rendered TUI snapshots under docs/tui stay in the
    # repository (review aids, not crate contents)
    "/docs/VERSIONING.md",
    "/docs/architecture.md",
    "/docs/roadmap.md",
    "/config.example.toml",
]

[lib]
name = "kazi"
path = "src/lib.rs"

[[bin]]
name = "kazi"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
# rustls-tls: pure-Rust TLS stack so the same build works on windows-gnu/msvc and linux
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls",
    "http2",
    "charset",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
async-trait = "0.1"
futures = "0.3"
unicode-width = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6"
ratatui = "0.29.0"
crossterm = { version = "0.28.1", features = ["event-stream"] }

[profile.release]
lto = true
strip = true

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
