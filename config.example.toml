# kazi configuration example.
# `kazi config --init` writes this file; running bare `kazi` offers to as well.
# API keys never live in this file: they come from environment variables
# (`api_key_env` below) or from the local store written by `kazi auth set <nick>`.
# When both are set, the environment variable wins.

# provider used when --provider is omitted
provider = "deepseek"

# [agent]
# max_rounds = 30                  # hard cap on model<->tool rounds per task
# max_context_tokens = 60000       # rough budget; oldest non-system turns are dropped
# max_parallel_tools = 4           # concurrent tool executions within a round
# permission_mode = "edit"         # read-only | review | edit | yolo
# preset = "balanced"              # fast | balanced | deep (the TUI's /effort writes this line)
# max_usd_per_task = 1.00          # stop between rounds once this task costs more (needs [usage.prices])
#
# Request presets: temperature / output budget / reasoning effort sent with
# every round. The three built-ins exist without config; anything here wins.
# [agent.presets.deep]
# temperature = 0.2
# max_tokens = 8192
# reasoning_effort = "high"       # low | medium | high, where the endpoint understands it
#
# Token prices for /cost and `kazi run`'s cost line. USD per 1M tokens.
# kazi ships NO prices: an unpriced model shows tokens and never a guessed
# number. Key by model id (a gateway id also matches its last segment).
# [usage.prices."deepseek-chat"]
# input = 0.27
# output = 1.10
# cache_read = 0.027

# [ui]
# theme = "dark"                   # dark | light | nord | solarized | mono (the TUI's /theme changes this line)
# details = false                  # start with full tool output expanded (Ctrl+O toggles; /details writes this line)
# bell = false                     # ring the terminal when a task finishes

# [mcp]
# Local MCP (Model Context Protocol) servers; their tools join the catalog as
# mcp_<server>_<name>, spawned at agent start via stdio:
# [mcp.servers.files]
# command = "npx"
# args = ["-y", "@modelcontextprotocol/server-filesystem", "D:/Code"]
# Remote ones speak Streamable HTTP instead (no local process needed):
# [mcp.servers.remote]
# url = "https://mcp.example.com/mcp"
# api_key_env = "EXAMPLE_TOKEN"

# [tools]
# sandbox_root = "D:/Code"         # if set, file tools stay inside this root; leave the line commented to disable
# command_timeout_secs = 120       # per run_command call
# output_limit = 64000             # max characters of stdout/stderr fed back to the model
# allow_commands = ["cargo build", "cargo test", "git status"]   # auto-approved after safety check

# Each entry under [providers.*] is a selectable provider, pick any nickname.
# type: "openai"  -> any OpenAI-compatible endpoint (OpenAI, DeepSeek, Kimi, Qwen, gateways...)
# type: "anthropic" -> Anthropic Claude Messages API
# type: "ollama"  -> local Ollama via its OpenAI-compatible endpoint

[providers.deepseek]
type = "openai"
base_url = "https://api.deepseek.com/v1"
api_key_env = "DEEPSEEK_API_KEY"
model = "deepseek-chat"
# models = ["deepseek-chat", "deepseek-reasoner"]   # extras the /model picker offers (optional)

[providers.openrouter]
type = "openai"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
model = "anthropic/claude-sonnet-4.5"

[providers.anthropic]
type = "anthropic"
api_key_env = "ANTHROPIC_API_KEY"
model = "claude-sonnet-4-5"

[providers.ollama]
type = "ollama"
base_url = "http://localhost:11434/v1"
model = "qwen3:14b"
